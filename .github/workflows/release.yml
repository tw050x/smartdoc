name: Release

# Run by hand (Actions → Release → Run workflow) on the branch to release. The release only
# goes ahead once the Prerequisites workflow has passed on the same commit; if it's still
# running, this waits.
#
# DRY RUN: releases must be signed and notarised before they're published, and signing isn't
# set up yet. Until it is, this builds unsigned packages (attached to the run for testing) and
# reports what it would release, but creates no tag and no release. The publish step is added
# together with signing, so unsigned builds can't be published by accident.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prerequisites:
    name: Wait for Prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for a successful Prerequisites run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow prerequisites.yml --commit "$GITHUB_SHA" \
              --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "No Prerequisites run for $GITHUB_SHA yet. Waiting…"
            else
              status=$(jq -r .status <<<"$run")
              conclusion=$(jq -r .conclusion <<<"$run")
              url=$(jq -r .url <<<"$run")
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "Prerequisites passed: $url"
                  exit 0
                fi
                echo "::error::Prerequisites did not pass ($conclusion): $url"
                exit 1
              fi
              echo "Prerequisites is $status: $url. Waiting…"
            fi
            sleep 20
          done

  build:
    name: Build (${{ matrix.os }})
    needs: prerequisites
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          # Unsigned until signing and notarisation are set up.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: employment-short-list-app-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  dry-run:
    name: Dry run (no release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Report what would be released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            tag_note="⚠️ Tag $tag already exists: bump the version in package.json before a real release."
          else
            tag_note="Tag $tag is free."
          fi
          {
            echo "## Dry run: nothing was released"
            echo
            echo "Releases must be signed and notarised first, and signing isn't set up yet."
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Would release version **$version** as tag **$tag**. $tag_note"
            echo "- Unsigned packages (download from this run's artifacts):"
            for f in artifacts/*; do echo "  - $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
